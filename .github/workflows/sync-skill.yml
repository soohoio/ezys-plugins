name: Sync skill

# plugins/docs/skills/ezys-docs/SKILL.md is a copy of https://docs.ezys.io/SKILL.md,
# whose only source is soohoio/ezys-core apps/docs/agent/SKILL.md. When the
# published file changes, this opens (or updates) one pull request that copies
# it and bumps the plugin's patch version — clients update an installed plugin
# only when its version changes.
on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:

concurrency:
  group: sync-skill
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    env:
      BRANCH: sync/ezys-docs-skill
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # `shell: bash` runs with -o pipefail: a failed sync must fail the step,
      # not hand an empty `changed` to the steps below through tee.
      - id: sync
        shell: bash
        run: node scripts/sync-skill.mjs | tee -a "$GITHUB_OUTPUT"

      # The published file went back to what main already has: an open sync PR
      # would now copy an outdated SKILL.md, so close it.
      - name: Close a sync pull request that is no longer needed
        if: steps.sync.outputs.changed == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')
          if [ -n "$pr" ]; then
            gh pr close "$pr" --delete-branch --comment "https://docs.ezys.io/SKILL.md matches main again; nothing to sync."
          fi

      - if: steps.sync.outputs.changed == 'true'
        run: node scripts/check.mjs --live

      - name: Open or update the pull request
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.sync.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C "$BRANCH"
          git add plugins/docs
          git commit -m "chore(docs): sync SKILL.md from docs.ezys.io, docs@$VERSION"
          git push --force origin "$BRANCH"
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')" ]; then
            gh pr create --base main --head "$BRANCH" \
              --title "chore(docs): sync SKILL.md from docs.ezys.io (docs@$VERSION)" \
              --body "Copies https://docs.ezys.io/SKILL.md into plugins/docs/skills/ezys-docs/ and bumps the plugin to $VERSION. Generated by .github/workflows/sync-skill.yml."
          fi
