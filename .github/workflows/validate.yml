name: Validate

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Manifests agree with each other; the skill copy equals the published
      # SKILL.md and the MCP server answers (a stale copy fails here, and
      # sync-skill.yml opens the PR that fixes it).
      - run: node scripts/check.mjs --live

      - name: Validate the Claude Code marketplace and plugin
        run: npx --yes @anthropic-ai/claude-code@2.1.302 plugin validate --strict .
